# API gateway — §6.4 step 3 "Deploy behind an API gateway with workload
# identity, rate limits, private networking, and health probes" and §7.3
# "the gateway ... attaches a correlation identifier".
#
# Every one of the 10 APIs and 5 MCP tools is reachable on ONE port (8080).
# The six services stay separate processes behind it, as §7.8 step 38 requires.
#
# Two upstream modes:
#   host   - services run directly on the machine (development default)
#   compose- services run as containers (docker compose up)
# Switch by changing the `server` lines in each upstream block.

upstream ingestion    { server host.docker.internal:8001; }
upstream retrieval    { server host.docker.internal:8002; }
upstream composer     { server host.docker.internal:8003; }
upstream deletion     { server host.docker.internal:8004; }
upstream mcp          { server host.docker.internal:8005; }
upstream processor    { server host.docker.internal:8006; }

# /v1/memories/{id} is shared: PATCH corrects (memory-processor) while DELETE
# erases (deletion-orchestrator). Route on the method rather than the path.
map $request_method $memory_by_id_backend {
    default  "http://processor";
    DELETE   "http://deletion";
}

# Correlation identifier for every request (§7.3 request flow). Reuses an
# inbound one when the caller already set it, so a trace survives the hop.
map $http_x_correlation_id $correlation_id {
    default  $http_x_correlation_id;
    ""       $request_id;
}

server {
    listen 8080;
    server_name _;

    # Logs carry identifiers and outcomes, never request bodies (§7.3:
    # "Logs contain identifiers and outcomes, not raw private content").
    access_log /var/log/nginx/gateway.log;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Correlation-Id  $correlation_id;
    add_header       X-Correlation-Id  $correlation_id always;

    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;

    # CORS is deliberately NOT set here. Each service already sets it via
    # CORSMiddleware, and a browser rejects a response carrying two
    # Access-Control-Allow-Origin headers. Preflight OPTIONS is proxied through
    # to the service that owns the route rather than answered here.

    # ---- gateway's own health -------------------------------------------
    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","service":"api-gateway","port":8080}';
    }

    # ---- the 10 required APIs (§7.3) ------------------------------------
    # Most specific paths first: nginx prefers exact (=) then longest regex.

    location = /v1/events            { proxy_pass http://ingestion; }   # 1
    location = /v1/memories/extract  { proxy_pass http://processor; }   # 2
    location = /v1/memories          { proxy_pass http://processor; }   # 3 (POST create)
    location = /v1/memories/search   { proxy_pass http://retrieval; }   # 4
    location = /v1/context/compose   { proxy_pass http://composer;  }   # 5
    location = /v1/feedback          { proxy_pass http://composer;  }   # 9

    # 6 (PATCH) and 7 (DELETE) share this path — split by method.
    location ~ ^/v1/memories/[^/]+$  { proxy_pass $memory_by_id_backend$request_uri; }

    location ~ ^/v1/deletions/       { proxy_pass http://deletion;  }   # 8
    location ~ ^/v1/traces/          { proxy_pass http://retrieval; }   # 10

    # ---- the 5 MCP tools (§7.5) -----------------------------------------
    location /tools/                 { proxy_pass http://mcp; }

    # ---- per-service interactive API docs, namespaced ------------------
    # The docs page FastAPI serves asks for "/openapi.json" at the site root.
    # Six services cannot all own that one path, so the HTML is rewritten to
    # point at this service's own namespaced copy, which is proxied below.

    location = /docs/ingestion/openapi.json { proxy_pass http://ingestion/openapi.json; }
    location = /docs/retrieval/openapi.json { proxy_pass http://retrieval/openapi.json; }
    location = /docs/composer/openapi.json  { proxy_pass http://composer/openapi.json;  }
    location = /docs/deletion/openapi.json  { proxy_pass http://deletion/openapi.json;  }
    location = /docs/mcp/openapi.json       { proxy_pass http://mcp/openapi.json;       }
    location = /docs/processor/openapi.json { proxy_pass http://processor/openapi.json; }

    location /docs/ingestion/ {
        proxy_pass http://ingestion/docs;
        proxy_set_header Accept-Encoding "";      # sub_filter needs plain text
        sub_filter "'/openapi.json'" "'/docs/ingestion/openapi.json'";
        sub_filter_types text/html;
        sub_filter_once off;
    }
    location /docs/retrieval/ {
        proxy_pass http://retrieval/docs;
        proxy_set_header Accept-Encoding "";
        sub_filter "'/openapi.json'" "'/docs/retrieval/openapi.json'";
        sub_filter_types text/html;
        sub_filter_once off;
    }
    location /docs/composer/ {
        proxy_pass http://composer/docs;
        proxy_set_header Accept-Encoding "";
        sub_filter "'/openapi.json'" "'/docs/composer/openapi.json'";
        sub_filter_types text/html;
        sub_filter_once off;
    }
    location /docs/deletion/ {
        proxy_pass http://deletion/docs;
        proxy_set_header Accept-Encoding "";
        sub_filter "'/openapi.json'" "'/docs/deletion/openapi.json'";
        sub_filter_types text/html;
        sub_filter_once off;
    }
    location /docs/mcp/ {
        proxy_pass http://mcp/docs;
        proxy_set_header Accept-Encoding "";
        sub_filter "'/openapi.json'" "'/docs/mcp/openapi.json'";
        sub_filter_types text/html;
        sub_filter_once off;
    }
    location /docs/processor/ {
        proxy_pass http://processor/docs;
        proxy_set_header Accept-Encoding "";
        sub_filter "'/openapi.json'" "'/docs/processor/openapi.json'";
        sub_filter_types text/html;
        sub_filter_once off;
    }

    # Anything else is not part of the published contract.
    location / {
        default_type application/json;
        return 404 '{"error_code":"not_found","message":"no such endpoint on this gateway"}';
    }
}
