apiVersion: apps/v1
kind: Deployment
metadata:
  name: context-composer
  labels: { app: context-composer }
spec:
  replicas: 2
  selector:
    matchLabels: { app: context-composer }
  template:
    metadata:
      labels: { app: context-composer }
    spec:
      containers:
        - name: context-composer
          image: spotify-memory/context-composer:latest
          ports: [{ containerPort: 8003 }]
          envFrom:
            - secretRef: { name: memory-system-secrets }
          readinessProbe:
            httpGet: { path: /health, port: 8003 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8003 }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: context-composer
spec:
  selector: { app: context-composer }
  ports:
    - port: 8003
      targetPort: 8003
