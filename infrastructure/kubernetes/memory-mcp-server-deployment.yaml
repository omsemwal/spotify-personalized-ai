apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-mcp-server
  labels: { app: memory-mcp-server }
spec:
  replicas: 2
  selector:
    matchLabels: { app: memory-mcp-server }
  template:
    metadata:
      labels: { app: memory-mcp-server }
    spec:
      containers:
        - name: memory-mcp-server
          image: spotify-memory/memory-mcp-server:latest
          ports: [{ containerPort: 8005 }]
          envFrom:
            - secretRef: { name: memory-system-secrets }
          readinessProbe:
            httpGet: { path: /health, port: 8005 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8005 }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: memory-mcp-server
spec:
  selector: { app: memory-mcp-server }
  ports:
    - port: 8005
      targetPort: 8005
