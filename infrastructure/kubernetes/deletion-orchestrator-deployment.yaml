apiVersion: apps/v1
kind: Deployment
metadata:
  name: deletion-orchestrator
  labels: { app: deletion-orchestrator }
spec:
  replicas: 2
  selector:
    matchLabels: { app: deletion-orchestrator }
  template:
    metadata:
      labels: { app: deletion-orchestrator }
    spec:
      containers:
        - name: deletion-orchestrator
          image: spotify-memory/deletion-orchestrator:latest
          ports: [{ containerPort: 8004 }]
          envFrom:
            - secretRef: { name: memory-system-secrets }
          readinessProbe:
            httpGet: { path: /health, port: 8004 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8004 }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: deletion-orchestrator
spec:
  selector: { app: deletion-orchestrator }
  ports:
    - port: 8004
      targetPort: 8004
