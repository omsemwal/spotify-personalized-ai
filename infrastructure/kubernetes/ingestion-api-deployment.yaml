apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-api
  labels: { app: ingestion-api }
spec:
  replicas: 2
  selector:
    matchLabels: { app: ingestion-api }
  template:
    metadata:
      labels: { app: ingestion-api }
    spec:
      containers:
        - name: ingestion-api
          image: spotify-memory/ingestion-api:latest
          ports: [{ containerPort: 8001 }]
          envFrom:
            - secretRef: { name: memory-system-secrets }
          readinessProbe:
            httpGet: { path: /health, port: 8001 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8001 }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: ingestion-api
spec:
  selector: { app: ingestion-api }
  ports:
    - port: 8001
      targetPort: 8001
