apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-processor
  labels: { app: memory-processor }
spec:
  replicas: 2
  selector:
    matchLabels: { app: memory-processor }
  template:
    metadata:
      labels: { app: memory-processor }
    spec:
      containers:
        - name: memory-processor
          image: spotify-memory/memory-processor:latest
          ports: [{ containerPort: 8006 }]
          envFrom:
            - secretRef: { name: memory-system-secrets }
          readinessProbe:
            httpGet: { path: /health, port: 8006 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8006 }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: memory-processor
spec:
  selector: { app: memory-processor }
  ports:
    - port: 8006
      targetPort: 8006
