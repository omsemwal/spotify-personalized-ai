; Test configuration. One file, so `pytest` behaves identically for you
; locally and for CI. See docs/PLAN.md for what each test layer is for.
[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

; -ra prints a short reason for every non-passing test at the end of the run,
; which is what you want when reading a CI log rather than a terminal.
addopts = -ra --strict-markers

markers =
    integration: needs a running datastore from docker-compose (U4 onward).
    security: subject isolation, prompt injection, tool abuse (§7.7 Security).

; Warnings are shown, not hidden. The naive-datetime DeprecationWarning from
; packages/graph-schema is known and is fixed in U7; if it ever disappears
; before then, we want to notice.
filterwarnings =
    default
