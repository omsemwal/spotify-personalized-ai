# Why this file exists
# ====================
#
# Deploys the backend on Render in one go ("Blueprint"): the API, the worker,
# PostgreSQL and Redis, wired to each other. Render reads this file when you
# choose New -> Blueprint and pick this repository.
#
# Neo4j and Kafka are not offered by Render, so they come from outside:
#   Neo4j  -> Neo4j AuraDB        (NEO4J_URI, NEO4J_USER, NEO4J_PASSWORD)
#   Kafka  -> Redpanda Cloud      (KAFKA_BOOTSTRAP, KAFKA_USERNAME, KAFKA_PASSWORD)
#
# Every value marked `sync: false` is a secret: Render asks you to type it in
# its dashboard. Secrets are never written in this file or in GitHub.
#
# Check against Render's current docs before the first deploy (render.com/docs/
# blueprint-spec): plan names and prices, the Key Value service type name, and
# whether Python 3.14 is available. This file was written without access to a
# Render account, so it has not been deployed yet.

services:
  # The API - all ten endpoints, login, MCP-backed tools, /health.
  - type: web
    name: memory-api
    runtime: python
    plan: starter            # the embedding model needs more than 512 MB of RAM
    buildCommand: pip install -r requirements.txt
    # Tables, Neo4j indexes and the demo logins. Safe to run on every deploy.
    preDeployCommand: python scripts/setup.py
    startCommand: python -m uvicorn memory.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.14.3"
      - key: DATABASE_URL
        fromDatabase:
          name: memory-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: memory-redis
          property: connectionString
      - key: MEMORY_JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        value: neo4j
      - key: NEO4J_PASSWORD
        sync: false
      - key: KAFKA_BOOTSTRAP
        sync: false
      - key: KAFKA_USERNAME
        sync: false
      - key: KAFKA_PASSWORD
        sync: false
      - key: KAFKA_SASL_MECHANISM
        value: SCRAM-SHA-256   # PLAIN for Confluent Cloud

  # The worker - reads the queue and turns events into memories.
  - type: worker
    name: memory-worker
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/run_processor.py --forever
    # The same settings as the API - the worker talks to the same stores.
    envVars:
      - key: PYTHON_VERSION
        value: "3.14.3"
      - key: DATABASE_URL
        fromDatabase:
          name: memory-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: memory-redis
          property: connectionString
      - key: MEMORY_JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        value: neo4j
      - key: NEO4J_PASSWORD
        sync: false
      - key: KAFKA_BOOTSTRAP
        sync: false
      - key: KAFKA_USERNAME
        sync: false
      - key: KAFKA_PASSWORD
        sync: false
      - key: KAFKA_SASL_MECHANISM
        value: SCRAM-SHA-256   # PLAIN for Confluent Cloud

  # Redis - idempotency keys, rate limits, login lockouts.
  - type: keyvalue
    name: memory-redis
    plan: free
    ipAllowList: []          # reachable only from the services above

databases:
  # PostgreSQL - accounts, consent, events, audit log, deletion jobs.
  - name: memory-postgres
    databaseName: spotify_personalized_ai
    plan: free
