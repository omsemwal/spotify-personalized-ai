# Continuous integration — runs on every pull request and every push to main.
#
# This is the gate the whole build plan leans on: a unit is not finished until
# this is green. See docs/PLAN.md §7 U1.
#
# The three jobs run in parallel so a lint failure does not hide a test failure.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch cancels the previous run — no point spending
# minutes on a commit that has already been replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check packages services tests data

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: mypy

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pip install -e packages/contracts
      # Until U4, the test suite runs against in-memory doubles rather than the
      # real datastores, so no service containers are needed here. When U4
      # lands, the integration tests get a `services:` block for Neo4j,
      # Postgres, Redis and Redpanda.
      - run: pytest
        env:
          LOCAL_MODE: "true"
          EMBEDDING_BACKEND: local_hash
