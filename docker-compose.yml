# Local development stores.
#
# abc.md:219 - PostgreSQL: "Stores consent state, ingestion status, tool
#              audit, experiments, feedback, and deletion jobs."
# abc.md:222 - Redis: "Short-lived subject-scoped caching, rate limiting,
#              and idempotency support."
#
# abc.md:207 - Redpanda: "Durable event capture, partitioning, replay,
#              backpressure, and consumer isolation." The spec names
#              "Apache Kafka or Redpanda"; Redpanda is one container
#              instead of a JVM stack and speaks the same protocol.
#
# Neo4j and the vector index arrive with later endpoints.
#
# NOTE: postgres and redis below are NOT used on this machine - a local
# PostgreSQL 18 and Redis are already installed and .env points at them.
# The containers are kept for anyone setting up from scratch. Start only
# what you need:
#
#   docker compose up -d redpanda
#
# Start with:  docker compose up -d
# Stop with:   docker compose down          (data is kept)
# Wipe with:   docker compose down -v       (deletes the volumes)

services:
  postgres:
    image: postgres:16
    container_name: memory-postgres
    environment:
      POSTGRES_USER: memory
      POSTGRES_PASSWORD: memory_local_dev
      POSTGRES_DB: memory
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/database-migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory -d memory"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    container_name: memory-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redpanda:
    image: redpandadata/redpanda:latest
    container_name: memory-redpanda
    command:
      - redpanda
      - start
      - --smp=1                     # one CPU core is plenty for the pilot
      - --memory=512M               # keep it small; this machine is busy
      - --overprovisioned           # do not expect dedicated hardware
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://localhost:9092
    ports:
      - "9092:9092"                 # the Kafka protocol port
      - "9644:9644"                 # admin API, used by the health check
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
  redpanda_data:
